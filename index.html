<!doctype html>
<html lang="uk">
<head>

<meta property="og:type" content="website">

<meta property="og:description" content="Створи кімнату, надішли код друзям — і дізнайся, яким тебе бачать вони й ти сам. Тип, шкали, радар, сумісність, гра «Вгадай».">
<meta property="og:url" content="https://kiruhatko.github.io/MBTI/">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='a' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff8bd0'/%3E%3Cstop offset='1' stop-color='%239d8bff'/%3E%3C/linearGradient%3E%3ClinearGradient id='b' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234fe3ff'/%3E%3Cstop offset='1' stop-color='%232c86e6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%23140f3d'/%3E%3Ccircle cx='25' cy='27' r='15' fill='url(%23a)' opacity='.95'/%3E%3Ccircle cx='39' cy='38' r='15' fill='url(%23b)' opacity='.9'/%3E%3C/svg%3E">
<title>Дзеркало MBTI — тип очима друга</title>
<style>
:root,:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#f6f7ff; --ink-2:rgba(236,239,255,.76); --ink-3:rgba(226,230,255,.62);
  --bg-a:#0d0b26; --bg-b:#1a1250; --bg-c:#2b0f5c; --bg-d:#0e2748;
  --glass-top:rgba(255,255,255,.17); --glass-bot:rgba(255,255,255,.05);
  --rim:rgba(255,255,255,.38); --rim-dim:rgba(255,255,255,.09);
  --shadow:0 18px 50px rgba(5,3,25,.42);
  --track:rgba(255,255,255,.11); --track-edge:rgba(0,0,0,.28);
  --orb-o:.78;
  --accent:#8b7bff; --accent-2:#35d3ff;
  --g1:#ff8bd0; --g2:#9d8bff; --g3:#4fe3ff;
  --neg:#ff6aa8; --pos:#3be0b4; --neu:#b9bcdc;
  --ok:#4ade80; --warn:#ffb340; --err:#ff7a9c;
  --r-lg:30px; --r-md:22px;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --ink:#171540; --ink-2:rgba(23,21,64,.76); --ink-3:rgba(23,21,64,.54);
    --bg-a:#d9e3ff; --bg-b:#efdcff; --bg-c:#ffdfee; --bg-d:#d3f1ff;
    --glass-top:rgba(255,255,255,.68); --glass-bot:rgba(255,255,255,.26);
    --rim:rgba(255,255,255,.98); --rim-dim:rgba(255,255,255,.45);
    --shadow:0 18px 50px rgba(72,60,150,.20);
    --track:rgba(30,30,100,.10); --track-edge:rgba(30,30,100,.12);
    --orb-o:.62;
    --neu:#7d80a8;
    --g1:#d42f94; --g2:#6446ee; --g3:#0a86d6;
  }
}
:root[data-theme="light"]{
    color-scheme:light;
    --ink:#171540; --ink-2:rgba(23,21,64,.76); --ink-3:rgba(23,21,64,.54);
    --bg-a:#d9e3ff; --bg-b:#efdcff; --bg-c:#ffdfee; --bg-d:#d3f1ff;
    --glass-top:rgba(255,255,255,.68); --glass-bot:rgba(255,255,255,.26);
    --rim:rgba(255,255,255,.98); --rim-dim:rgba(255,255,255,.45);
    --shadow:0 18px 50px rgba(72,60,150,.20);
    --track:rgba(30,30,100,.10); --track-edge:rgba(30,30,100,.12);
    --orb-o:.62;
    --neu:#7d80a8;
    --g1:#d42f94; --g2:#6446ee; --g3:#0a86d6;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;background:var(--bg-b)}
body{
  min-height:100vh;min-height:100dvh;
  font:16px/1.5 "SF Pro Display",-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(155deg,var(--bg-a),var(--bg-b) 38%,var(--bg-c) 68%,var(--bg-d)) fixed;
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;
}
button,input{font:inherit;color:inherit}
h1,h2,h3{line-height:1.12;letter-spacing:-.02em}
.orbs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.orbs i{position:absolute;border-radius:50%;filter:blur(46px);opacity:var(--orb-o);animation:drift 28s ease-in-out infinite alternate}
.orbs i:nth-child(1){width:52vmax;height:52vmax;left:-16vmax;top:-18vmax;background:radial-gradient(circle at 30% 30%,#ff5fa2,#7a3cff 72%)}
.orbs i:nth-child(2){width:42vmax;height:42vmax;right:-14vmax;top:8vh;background:radial-gradient(circle at 60% 40%,#35d3ff,#4a5cff 70%);animation-duration:34s;animation-delay:-8s}
.orbs i:nth-child(3){width:38vmax;height:38vmax;left:12vw;bottom:-18vmax;background:radial-gradient(circle at 40% 40%,#ffb340,#ff5f7a 72%);animation-duration:31s;animation-delay:-14s}
.orbs i:nth-child(4){width:30vmax;height:30vmax;right:6vw;bottom:-10vmax;background:radial-gradient(circle at 50% 50%,#3be0b4,#2c7bff 75%);animation-duration:38s;animation-delay:-20s}
@keyframes drift{to{transform:translate3d(7vmax,5vmax,0) scale(1.14)}}

#app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;padding:max(18px,env(safe-area-inset-top)) 16px max(34px,env(safe-area-inset-bottom))}
.wrap{width:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.wrap.wide{max-width:1040px}
.center{text-align:center}

/* ───────── liquid glass ───────── */
.glass{
  position:relative;isolation:isolate;border-radius:var(--r-lg);
  background:linear-gradient(140deg,var(--glass-top),var(--glass-bot));
  -webkit-backdrop-filter:blur(26px) saturate(1.8) brightness(1.06);
  backdrop-filter:blur(26px) saturate(1.8) brightness(1.06);
  box-shadow:var(--shadow),inset 0 1.5px 0 var(--rim),inset 0 -1.5px 0 var(--rim-dim),inset 1.5px 0 0 var(--rim-dim),inset 0 0 30px rgba(255,255,255,.06);
}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;
  background:conic-gradient(from 215deg at 50% 50%,rgba(255,255,255,.8),rgba(255,255,255,0) 17%,rgba(110,205,255,.38) 38%,rgba(255,255,255,0) 55%,rgba(255,120,205,.38) 76%,rgba(255,255,255,.75));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
}
.glass::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(380px circle at var(--mx,20%) var(--my,0%),rgba(255,255,255,.22),transparent 60%);
  transition:opacity .4s;
}
.card{padding:22px}
.card.tight{padding:16px 18px}
.card h2{font-size:1.15rem;margin-bottom:4px}
.card .sub{color:var(--ink-2);font-size:.92rem}

/* ───────── controls ───────── */
.btn{
  appearance:none;border:0;cursor:pointer;font-weight:620;letter-spacing:-.005em;
  padding:.82em 1.35em;border-radius:999px;position:relative;isolation:isolate;
  background:linear-gradient(140deg,var(--glass-top),var(--glass-bot));
  -webkit-backdrop-filter:blur(18px) saturate(1.7);backdrop-filter:blur(18px) saturate(1.7);
  box-shadow:0 8px 22px rgba(5,3,25,.26),inset 0 1.5px 0 var(--rim),inset 0 -1.5px 0 var(--rim-dim);
  transition:transform .28s cubic-bezier(.3,1.7,.5,1),box-shadow .25s,filter .25s,opacity .25s;
}
.btn:hover{transform:translateY(-1px) scale(1.025)}
.btn:active{transform:scale(.965)}
.btn:focus-visible,.pt:focus-visible,.role:focus-visible,.seg button:focus-visible,.input:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px}
.btn.primary{color:#fff;text-shadow:0 1px 10px rgba(25,8,80,.45);background:linear-gradient(140deg,rgba(139,123,255,.92),rgba(53,211,255,.78))}
.btn.big{font-size:1.08rem;padding:1em 1.6em;width:100%}
.btn.ghost{background:linear-gradient(140deg,rgba(255,255,255,.07),rgba(255,255,255,.02));box-shadow:inset 0 1px 0 var(--rim-dim),inset 0 -1px 0 var(--rim-dim)}
.btn.small{padding:.5em 1em;font-size:.88rem}
.btn[disabled]{opacity:.42;pointer-events:none;filter:saturate(.6)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.grow>*{flex:1 1 0}
.row.spread{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.input{
  width:100%;padding:.85em 1.1em;border-radius:18px;border:0;outline:none;
  background:rgba(255,255,255,.08);
  box-shadow:inset 0 2px 8px rgba(0,0,0,.28),inset 0 -1px 0 var(--rim-dim),0 0 0 1px rgba(255,255,255,.1);
  transition:box-shadow .2s;
}
.input::placeholder{color:var(--ink-3)}
.input:focus{box-shadow:inset 0 2px 8px rgba(0,0,0,.28),0 0 0 2px var(--accent-2)}
.row>.input{min-width:0}
.input.code{text-align:center;font-weight:700;letter-spacing:.28em;text-transform:uppercase;font-size:1.15rem}
.chip{display:inline-flex;align-items:center;gap:7px;padding:.32em .8em;border-radius:999px;font-size:.82rem;font-weight:600;
  background:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 var(--rim-dim),0 0 0 1px rgba(255,255,255,.08);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--neu);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.dot.wait{background:var(--warn);animation:pulse 1.3s infinite}
.dot.off{background:var(--err)}
@keyframes pulse{50%{opacity:.3;transform:scale(.7)}}
.seg{display:flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 2px 6px rgba(0,0,0,.22)}
.seg button{flex:1;border:0;background:none;cursor:pointer;padding:.55em .9em;border-radius:999px;font-weight:600;color:var(--ink-2);transition:all .3s cubic-bezier(.3,1.5,.5,1)}
.seg button.on{color:var(--ink);background:linear-gradient(140deg,var(--glass-top),var(--glass-bot));box-shadow:0 4px 14px rgba(5,3,25,.28),inset 0 1.5px 0 var(--rim)}
.muted{color:var(--ink-2)} .fine{color:var(--ink-3);font-size:.8rem;line-height:1.45}
.err{color:var(--err);font-size:.9rem;min-height:1.2em}
.grad{background:linear-gradient(100deg,var(--g1),var(--g2) 45%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.or{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--rim-dim),transparent)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ───────── home ───────── */
.logo{width:96px;height:96px;margin:6px auto 2px;position:relative}
.logo i{position:absolute;width:62px;height:62px;border-radius:50%;
  background:linear-gradient(140deg,rgba(255,255,255,.42),rgba(255,255,255,.08));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -2px 8px rgba(255,255,255,.18),0 10px 28px rgba(10,5,50,.4);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.logo i:first-child{left:0;top:6px;background:linear-gradient(140deg,rgba(255,120,200,.7),rgba(255,255,255,.08))}
.logo i:last-child{right:0;bottom:6px;background:linear-gradient(140deg,rgba(80,220,255,.7),rgba(255,255,255,.08))}
h1.title{font-size:clamp(2.1rem,8vw,3rem);font-weight:780}
.lead{font-size:1.06rem;color:var(--ink-2);max-width:34em;margin:0 auto}
.steps{list-style:none;display:grid;gap:12px;padding:18px 20px;counter-reset:s}
.steps li{display:flex;gap:14px;align-items:flex-start;text-align:left;color:var(--ink-2);font-size:.95rem}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--ink);
  background:linear-gradient(140deg,var(--glass-top),var(--glass-bot));box-shadow:inset 0 1px 0 var(--rim),0 4px 10px rgba(5,3,25,.25)}
.steps b{color:var(--ink)}
.resume{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;text-align:left}
.invite{border-radius:18px;padding:12px 14px;background:rgba(59,224,180,.14);box-shadow:inset 0 0 0 1px rgba(59,224,180,.35);color:var(--ink);text-align:left;font-size:.95rem}

/* ───────── lobby ───────── */
.code-box{text-align:center;padding:24px 20px}
.code-big{font-size:clamp(2.2rem,11vw,3.6rem);font-weight:800;letter-spacing:.16em;margin:6px 0 12px;padding-left:.16em;font-variant-numeric:tabular-nums}
.people{display:grid;gap:10px}
.person{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 var(--rim-dim),0 0 0 1px rgba(255,255,255,.06)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:750;flex:none;color:#fff;
  background:linear-gradient(140deg,#9d8bff,#35d3ff);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),0 6px 16px rgba(5,3,25,.3)}
.avatar.ghost{background:rgba(255,255,255,.08);color:var(--ink-3);box-shadow:none;border:1.5px dashed rgba(255,255,255,.3)}
.person .who{flex:1;min-width:0}
.person .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .who small{color:var(--ink-3)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role{appearance:none;border:0;text-align:left;cursor:pointer;padding:18px 16px;border-radius:24px;display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(140deg,var(--glass-top),var(--glass-bot));
  box-shadow:0 8px 24px rgba(5,3,25,.25),inset 0 1.5px 0 var(--rim),inset 0 -1.5px 0 var(--rim-dim);
  transition:transform .3s cubic-bezier(.3,1.6,.5,1),box-shadow .3s,background .3s}
.role:hover{transform:translateY(-2px)}
.role .em{font-size:1.9rem;line-height:1}
.role b{font-size:1.02rem}
.role span{color:var(--ink-2);font-size:.84rem;line-height:1.35}
.role.on{background:linear-gradient(140deg,rgba(139,123,255,.6),rgba(53,211,255,.38));box-shadow:0 10px 30px rgba(80,70,220,.4),inset 0 1.5px 0 rgba(255,255,255,.7),0 0 0 2px rgba(255,255,255,.55)}
.role[disabled]{opacity:.4;pointer-events:none}
.warn{border-radius:18px;padding:12px 14px;background:rgba(255,179,64,.16);box-shadow:inset 0 0 0 1px rgba(255,179,64,.4);font-size:.92rem}
.warn.bad{background:rgba(255,122,156,.16);box-shadow:inset 0 0 0 1px rgba(255,122,156,.45)}

/* ───────── quiz ───────── */
.progress{height:10px;border-radius:99px;background:var(--track);box-shadow:inset 0 1px 3px var(--track-edge);overflow:hidden}
.progress>i{display:block;height:100%;border-radius:inherit;width:var(--v,0%);transition:width .5s cubic-bezier(.2,.9,.3,1);
  background:linear-gradient(90deg,#ff8bd0,#9d8bff,#4fe3ff);box-shadow:0 0 14px rgba(157,139,255,.7)}
.qcard{padding:26px 22px 24px;min-height:340px;display:flex;flex-direction:column;justify-content:space-between;gap:22px}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--ink-3);font-size:.85rem}
.qtext{font-size:clamp(1.28rem,4.6vw,1.8rem);font-weight:660;line-height:1.28;letter-spacing:-.012em;text-wrap:balance}
.qanim{animation:qin .38s cubic-bezier(.2,.9,.3,1)}
@keyframes qin{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.qanim.back{animation-name:qinb}
@keyframes qinb{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(2px,1.2vw,10px);align-items:center;justify-items:center}
.pt{appearance:none;border:0;cursor:pointer;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;
  font-weight:700;font-size:clamp(.72rem,2.6vw,.95rem);color:var(--ink-2);--c:var(--neu);
  background:linear-gradient(140deg,var(--glass-top),var(--glass-bot));
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 70%,transparent),inset 0 2px 0 var(--rim),0 6px 16px rgba(5,3,25,.25);
  transition:transform .3s cubic-bezier(.3,1.8,.5,1),box-shadow .3s,background .3s,color .2s}
.pt:hover{transform:scale(1.1)}
.pt:active{transform:scale(.92)}
.pt.neg{--c:var(--neg)} .pt.pos{--c:var(--pos)}
.pt[data-s="3"],.pt[data-s="-3"]{width:100%}
.pt[data-s="2"],.pt[data-s="-2"]{width:84%}
.pt[data-s="1"],.pt[data-s="-1"]{width:70%}
.pt[data-s="0"]{width:58%}
.pt.sel{color:#fff;background:linear-gradient(140deg,color-mix(in srgb,var(--c) 95%,#fff),color-mix(in srgb,var(--c) 70%,#000));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -3px 8px rgba(0,0,0,.18),0 0 0 3px rgba(255,255,255,.55),0 8px 26px color-mix(in srgb,var(--c) 75%,transparent);transform:scale(1.08)}
.scale-cap{display:flex;justify-content:space-between;color:var(--ink-3);font-size:.78rem;margin-top:8px;padding:0 2px}
.scale-cap b{font-weight:600}
.hint{display:none}
@media (hover:hover){.hint{display:block;text-align:center}}

/* ───────── result ───────── */
.rv{opacity:0;transform:translateY(20px) scale(.985);transition:opacity .7s ease var(--d,0ms),transform .8s cubic-bezier(.2,.9,.2,1) var(--d,0ms)}
.rv.in{opacity:1;transform:none}
.col{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.grid>*{grid-column:span 12;min-width:0}
@media (min-width:900px){.span6{grid-column:span 6}.span7{grid-column:span 7}.span5{grid-column:span 5}.span8{grid-column:span 8}.span4{grid-column:span 4}}
.hero{padding:28px 22px 24px;text-align:center;overflow:hidden;--ac:#9d8bff}
.hero .glow{position:absolute;inset:-30% -10% auto -10%;height:80%;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,color-mix(in srgb,var(--ac) 55%,transparent),transparent);filter:blur(30px);opacity:.8}
.eyebrow{font-size:.82rem;text-transform:uppercase;letter-spacing:.16em;color:var(--ink-2);font-weight:650}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,.85fr);gap:10px;margin:18px auto 12px;max-width:560px}
.tile{min-width:0;padding:12px 2px 10px;border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:0;--c1:#fff;--c2:#fff}
.tile .l{font-size:clamp(2.6rem,12vw,4.6rem);font-weight:820;line-height:1.05;background:linear-gradient(160deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px color-mix(in srgb,var(--c2) 55%,transparent))}
.tile small{font-size:clamp(.52rem,2.2vw,.7rem);color:var(--ink-2);margin-top:-2px;max-width:100%;text-align:center}
.tile em{font-style:normal;font-size:.8rem;font-weight:700;margin-top:2px}
.tile.sfx{justify-content:center;padding:12px 2px}
.tile.sfx .l{font-size:clamp(1.6rem,6vw,2.4rem)}
.tname{font-size:clamp(1.7rem,6.5vw,2.6rem);font-weight:790}
.tagline{color:var(--ink-2);max-width:32em;margin:6px auto 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.views{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.view{padding:10px 8px;border-radius:18px;background:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 var(--rim-dim);text-align:center}
.view small{display:block;color:var(--ink-3);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
.view b{font-size:clamp(.82rem,4vw,1.05rem);white-space:nowrap}
.view.cur{background:linear-gradient(140deg,rgba(255,255,255,.22),rgba(255,255,255,.07));box-shadow:inset 0 1.5px 0 var(--rim),0 0 0 1.5px rgba(255,255,255,.4)}
.slider-box{padding:18px 20px}
.range{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:99px;margin:14px 0 8px;background:linear-gradient(90deg,#ff8bd0,#9d8bff,#4fe3ff);box-shadow:inset 0 1px 3px var(--track-edge);outline:none}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;cursor:grab;background:linear-gradient(140deg,rgba(255,255,255,.95),rgba(255,255,255,.55));box-shadow:0 4px 14px rgba(5,3,25,.5),inset 0 2px 0 #fff,0 0 0 3px rgba(255,255,255,.35)}
.range::-moz-range-thumb{width:30px;height:30px;border:0;border-radius:50%;cursor:grab;background:linear-gradient(140deg,#fff,rgba(255,255,255,.55));box-shadow:0 4px 14px rgba(5,3,25,.5)}
.range:focus-visible{outline:2px solid var(--accent-2);outline-offset:4px}
.range-cap{display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink-2)}

.axis{padding:18px 20px 16px}
.axis-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px;font-size:.92rem}
.axis-top .pole{color:var(--ink-3);display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.axis-top .pole.b{justify-content:flex-end;text-align:right}
.axis-top .pole.dom{color:var(--ink)}
.axis-top .pole b{font-size:1.15rem;font-weight:800}
.axis-top .pole em{font-style:normal;font-weight:750}
.axis-head{font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-2);font-weight:650;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.split{position:relative;height:18px;border-radius:99px;margin:26px 0 26px;background:var(--track);box-shadow:inset 0 2px 4px var(--track-edge),inset 0 -1px 0 var(--rim-dim)}
.split .fa,.split .fb{position:absolute;top:0;bottom:0;border-radius:99px;transition:width 1.2s cubic-bezier(.2,.9,.2,1) var(--d,0ms),left 1.2s cubic-bezier(.2,.9,.2,1) var(--d,0ms)}
.split .fa{left:0;width:0;background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 0 16px color-mix(in srgb,var(--c1) 60%,transparent),inset 0 1.5px 0 rgba(255,255,255,.55)}
.split .fb{right:0;width:0;background:linear-gradient(90deg,color-mix(in srgb,var(--c2) 22%,transparent),color-mix(in srgb,var(--c2) 12%,transparent))}
.in .split .fa{width:var(--v)}
.in .split .fb{width:calc(100% - var(--v))}
.knob{position:absolute;top:50%;left:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  background:linear-gradient(140deg,rgba(255,255,255,.95),rgba(255,255,255,.5));
  box-shadow:0 6px 18px rgba(5,3,25,.5),inset 0 2px 0 #fff,inset 0 -3px 6px rgba(0,0,0,.12),0 0 0 3px color-mix(in srgb,var(--c1) 50%,transparent);
  transition:left 1.2s cubic-bezier(.2,.9,.2,1) var(--d,0ms)}
.in .knob{left:var(--v)}
.mk{position:absolute;transform:translateX(-50%);font-size:.66rem;font-weight:750;letter-spacing:.02em;white-space:nowrap;padding:2px 7px;border-radius:99px;
  background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 var(--rim-dim),0 0 0 1px rgba(255,255,255,.16);transition:left 1.2s cubic-bezier(.2,.9,.2,1) var(--d,0ms)}
.mk.s{top:-26px;left:0}.mk.f{bottom:-26px;left:0}
.in .mk{left:var(--v)}
.mk::after{content:"";position:absolute;left:50%;margin-left:-3px;border:3px solid transparent}
.mk.s::after{top:100%;border-top-color:rgba(255,255,255,.5)}
.mk.f::after{bottom:100%;border-bottom-color:rgba(255,255,255,.5)}
.axis-note{color:var(--ink-2);font-size:.88rem}
.radar-wrap{display:grid;place-items:center;padding:6px 0 0}
.radar-wrap svg{width:100%;max-width:380px;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:.8rem;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid;margin-right:6px;vertical-align:middle;border-radius:3px}
.facets{display:grid;gap:18px}
.fgroup h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-2);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.fgroup h3 i{width:10px;height:10px;border-radius:50%;background:var(--c1);box-shadow:0 0 10px var(--c1)}
.facet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);gap:10px;align-items:center;font-size:.82rem;color:var(--ink-3);padding:5px 0}
.facet .a{text-align:right}
.facet .dom{color:var(--ink);font-weight:650}
.fbar{position:relative;height:10px;border-radius:99px;background:var(--track);box-shadow:inset 0 1px 3px var(--track-edge)}
.fbar>i{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:99px;background:linear-gradient(90deg,var(--c1),var(--c2));transition:width 1.1s cubic-bezier(.2,.9,.2,1) var(--d,0ms)}
.in .fbar>i{width:var(--v)}
.fbar>b{position:absolute;top:50%;left:0;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(5,3,25,.5);transition:left 1.1s cubic-bezier(.2,.9,.2,1) var(--d,0ms)}
.in .fbar>b{left:var(--v)}
.fname{grid-column:1/-1;text-align:center;font-size:.78rem;color:var(--ink-2);margin-bottom:-2px}
.ring-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:128px;height:128px;flex:none;display:grid;place-items:center}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(var(--c1) calc(var(--v)*1%),var(--track) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 13px),#000 calc(100% - 12px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 13px),#000 calc(100% - 12px));
  filter:drop-shadow(0 0 10px color-mix(in srgb,var(--c1) 55%,transparent))}
.ring b{font-size:1.7rem;font-weight:800}
.ring small{display:block;font-size:.66rem;color:var(--ink-3);margin-top:-6px;text-align:center}
.ring-txt{flex:1;min-width:180px}
.gap-list{display:grid;gap:10px;margin-top:14px}
.gap{padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.07);font-size:.88rem;color:var(--ink-2);box-shadow:inset 0 1px 0 var(--rim-dim)}
.gap b{color:var(--ink)}
.gap.same{background:rgba(59,224,180,.1)}
.stack4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fn{padding:14px 12px;border-radius:20px;background:rgba(255,255,255,.07);box-shadow:inset 0 1.5px 0 var(--rim-dim),0 0 0 1px rgba(255,255,255,.06);text-align:center}
.fn small{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
.fn .code{font-size:2rem;font-weight:820;line-height:1.1;margin:4px 0 2px;background:linear-gradient(150deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.fn b{font-size:.84rem;display:block}
.fn p{font-size:.76rem;color:var(--ink-2);margin-top:4px;line-height:1.35}
.lists{display:grid;gap:14px}
@media (min-width:560px){.lists{grid-template-columns:1fr 1fr}}
.lists h3{font-size:.95rem;margin-bottom:8px}
.lists ul{list-style:none;display:grid;gap:7px}
.lists li{padding-left:22px;position:relative;font-size:.92rem;color:var(--ink-2)}
.lists li::before{content:"";position:absolute;left:0;top:.5em;width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.lists .bad li::before{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.para{color:var(--ink-2);font-size:.98rem}
.alts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* ───────── questions list ───────── */
.qlist{display:grid;gap:10px}
.qrow{display:grid;grid-template-columns:34px 1fr;gap:6px 12px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.06);font-size:.9rem;box-shadow:inset 0 1px 0 var(--rim-dim)}
.qrow .n{font-weight:750;color:var(--ink-3)}
.qrow .f{font-weight:600}
.qrow .s{color:var(--ink-2);grid-column:2}
.qrow .tag{grid-column:2;font-size:.72rem;color:var(--ink-3)}
.qhead{font-size:.8rem;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-2);font-weight:700;margin:14px 2px 2px}

.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,24px);opacity:0;z-index:50;padding:.7em 1.3em;border-radius:999px;font-weight:600;font-size:.92rem;pointer-events:none;transition:all .4s cubic-bezier(.2,.9,.3,1)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:rot .9s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
@media (max-width:420px){
  .card{padding:18px 16px}
  .roles{grid-template-columns:1fr}
  .facet{grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr) minmax(0,.9fr);font-size:.76rem}
  .tiles{gap:6px}
  .hero{padding:24px 12px 20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0ms!important}
}
/* ───────── v2: налаштування, опції, гра, розбір, сумісність ───────── */
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.gear{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:30;width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;font-size:1.15rem}
.topbar{padding-right:54px}
.knob.b{width:22px;height:22px;margin:-11px 0 0 -11px;background:linear-gradient(140deg,#4fe3ff,#2c86e6);box-shadow:0 4px 12px rgba(5,3,25,.5),inset 0 1.5px 0 rgba(255,255,255,.8)}

/* ефекти «легко»: без розмиття — для слабких телефонів */
html[data-fx="lite"] .glass,html[data-fx="lite"] .btn,html[data-fx="lite"] .sheet{-webkit-backdrop-filter:none;backdrop-filter:none;background:linear-gradient(140deg,color-mix(in srgb,var(--bg-b) 78%,#fff 22%),color-mix(in srgb,var(--bg-c) 82%,#fff 18%))}
html[data-fx="lite"] .orbs i{animation:none;filter:blur(30px)}
html[data-fx="lite"] .glass::after{display:none}
html[data-theme="light"][data-fx="lite"] .glass,html[data-theme="light"][data-fx="lite"] .btn{background:rgba(255,255,255,.82)}

/* шторка налаштувань */
.sheet-back{position:fixed;inset:0;z-index:60;background:rgba(6,4,24,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fadein .25s}
@keyframes fadein{from{opacity:0}}
.sheet{width:100%;max-width:520px;margin:0 12px max(12px,env(safe-area-inset-bottom));padding:22px 20px 20px;border-radius:30px;animation:sheetup .35s cubic-bezier(.2,.9,.3,1)}
@keyframes sheetup{from{transform:translateY(40px);opacity:0}}
.sheet h2{font-size:1.2rem;margin-bottom:12px}
.set-row{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--rim-dim)}
.set-row:first-of-type{border-top:0}
.set-row b{font-size:.95rem}.set-row small{color:var(--ink-3);font-size:.8rem}
.set-row .seg button{padding:.5em .5em}

/* картки-варіанти (кімната / довжина) */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.opts .role{padding:16px 14px}
.opts .role b{font-size:1rem}
.stepper{display:flex;align-items:center;gap:10px;justify-content:center}
.stepper b{min-width:2.2em;text-align:center;font-size:1.3rem}

/* учасники */
.person .tagl{font-size:.7rem;font-weight:700;padding:.15em .6em;border-radius:99px;background:rgba(255,255,255,.12);color:var(--ink-2);white-space:nowrap}
.person .mini{height:6px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:6px}
.person .mini>i{display:block;height:100%;width:var(--v,0%);background:linear-gradient(90deg,#ff8bd0,#9d8bff,#4fe3ff);transition:width .6s}
.badge-q{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;padding:.2em .7em;border-radius:99px;background:rgba(255,194,61,.18);box-shadow:inset 0 0 0 1px rgba(255,194,61,.4)}

/* розбір розбіжностей */
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.fchip{appearance:none;border:0;cursor:pointer;padding:.38em .9em;border-radius:99px;font-size:.82rem;font-weight:650;color:var(--ink-2);background:rgba(255,255,255,.09);box-shadow:inset 0 1px 0 var(--rim-dim),0 0 0 1px rgba(255,255,255,.08);transition:all .25s}
.fchip.on{color:var(--ink);background:linear-gradient(140deg,var(--glass-top),var(--glass-bot));box-shadow:inset 0 1.5px 0 var(--rim),0 0 0 1.5px rgba(255,255,255,.4),0 6px 16px rgba(5,3,25,.25)}
.xlist{display:grid;gap:12px;margin-top:12px}
.xrow{padding:14px 14px 12px;border-radius:20px;background:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 var(--rim-dim)}
.xrow p{font-size:.92rem;font-weight:600;line-height:1.35;margin-bottom:12px}
.xtrack{position:relative;height:8px;border-radius:99px;background:var(--track);box-shadow:inset 0 1px 3px var(--track-edge);margin:20px 6px 22px}
.xtrack::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--rim-dim)}
.xtrack .tick{position:absolute;top:12px;font-size:.62rem;color:var(--ink-3);transform:translateX(-50%)}
.xtrack .xd{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;display:grid;place-items:center;font-size:.6rem;font-weight:800;color:#fff;box-shadow:0 3px 10px rgba(5,3,25,.45),inset 0 1.5px 0 rgba(255,255,255,.7);transition:left .9s cubic-bezier(.2,.9,.2,1)}
.xtrack .xd.s{background:linear-gradient(140deg,#ff8bd0,#d44fa4)}
.xtrack .xd.f{background:linear-gradient(140deg,#4fe3ff,#2c86e6)}
.xtrack .xd.o{background:linear-gradient(140deg,#8be68b,#2ea35a)}
.xtrack .xline{position:absolute;top:50%;height:3px;margin-top:-1.5px;background:linear-gradient(90deg,#ff8bd0,#4fe3ff);border-radius:3px;opacity:.7}
.xmeta{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--ink-3)}
.xmeta b{color:var(--ink-2)}
.xmore{margin-top:12px;text-align:center}

/* гра «Вгадай» */
.guess{padding:22px 20px;text-align:center}
.gpair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.gl{appearance:none;border:0;cursor:pointer;padding:12px 8px;border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);
  background:linear-gradient(140deg,var(--glass-top),var(--glass-bot));box-shadow:inset 0 1.5px 0 var(--rim),inset 0 -1.5px 0 var(--rim-dim),0 6px 16px rgba(5,3,25,.25);
  transition:transform .3s cubic-bezier(.3,1.7,.5,1),box-shadow .3s,background .3s;--c1:#fff;--c2:#fff}
.gl:hover{transform:translateY(-2px)}
.gl .l{font-size:2.2rem;font-weight:820;line-height:1.05}
.gl small{font-size:.72rem;color:var(--ink-2)}
.gl.on{background:linear-gradient(140deg,color-mix(in srgb,var(--c1) 70%,transparent),color-mix(in srgb,var(--c2) 55%,transparent));box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 0 0 2px rgba(255,255,255,.6),0 8px 24px color-mix(in srgb,var(--c1) 60%,transparent);transform:scale(1.04)}
.gres{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.gres .gc{padding:.4em .8em;border-radius:14px;font-weight:800;background:rgba(255,255,255,.1)}
.gres .gc.ok{background:rgba(74,222,128,.25);box-shadow:inset 0 0 0 1px rgba(74,222,128,.6)}
.gres .gc.no{background:rgba(255,122,156,.18);box-shadow:inset 0 0 0 1px rgba(255,122,156,.5)}

/* «театральне» розкриття */
.reveal-ov{position:fixed;inset:0;z-index:70;display:grid;place-items:center;text-align:center;padding:24px;
  background:radial-gradient(120% 90% at 50% 30%,rgba(60,30,140,.82),rgba(8,5,30,.94));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:fadein .3s}
.reveal-ov.out{animation:fadeout .5s forwards}
@keyframes fadeout{to{opacity:0;visibility:hidden}}
.rv-cap{font-size:.85rem;text-transform:uppercase;letter-spacing:.2em;color:rgba(236,239,255,.8);margin-bottom:14px}
.rv-letters{display:flex;gap:10px;justify-content:center;margin:8px 0 14px;perspective:700px}
.rv-letters .rl{width:clamp(56px,17vw,92px);aspect-ratio:.8;border-radius:22px;display:grid;place-items:center;font-size:clamp(2.4rem,11vw,4.2rem);font-weight:830;color:#fff;
  background:linear-gradient(140deg,rgba(255,255,255,.22),rgba(255,255,255,.06));box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 10px 30px rgba(5,3,25,.5);transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.9,.3,1)}
.rv-letters .rl.spin{animation:spinpulse .32s ease-in-out infinite alternate}
@keyframes spinpulse{from{transform:scale(.94);opacity:.75}to{transform:scale(1.04);opacity:1}}
.rv-name{font-size:clamp(1.8rem,7vw,2.8rem);font-weight:800;color:#fff;opacity:0;transform:translateY(12px);transition:all .6s}
.rv-name.in{opacity:1;transform:none}
.rv-skip{position:absolute;bottom:max(26px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%)}
#confetti{position:fixed;inset:0;z-index:80;pointer-events:none}

/* сумісність двох людей */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:18px auto 6px;max-width:560px}
.vs .pp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:22px;min-width:0}
.vs .pp .code{font-size:clamp(1.3rem,5.5vw,2rem);font-weight:820}
.vs .pp small{color:var(--ink-2);font-size:.78rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs .x{font-size:1.3rem;font-weight:800;color:var(--ink-3)}
.cmp-big{display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:12px}
.tline{display:grid;gap:10px;margin-top:14px}
.tline .gap b{display:block;margin-bottom:2px}

/* друзі в результаті */
.frow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:rgba(255,255,255,.07);font-size:.9rem}
.frow .avatar{width:32px;height:32px;font-size:.85rem}
.frow b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .chip{font-size:.75rem}
.agree{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.85rem;color:var(--ink-2)}
.agree .progress{flex:1;height:8px}

/* мої сесії */
.sess{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 var(--rim-dim)}
.sess .who{flex:1;min-width:0}
.sess .who b{display:block}
.sess .who small{color:var(--ink-3)}
.sess .act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.share-prev{display:block;width:100%;max-width:340px;margin:12px auto 0;border-radius:18px;box-shadow:0 12px 36px rgba(5,3,25,.5)}
.mt8{margin-top:8px}.mt14{margin-top:14px}
@media (prefers-reduced-motion:reduce){.rv-letters .rl.spin{animation:none}#confetti{display:none}}

/* збільшена зона натискання шкали (мінімум ~44 px), «Не знаю», контраст у світлій темі */
.pt::after{content:"";position:absolute;inset:-9px;border-radius:50%}
.btn.sel-skip{box-shadow:inset 0 0 0 2px var(--accent-2),0 0 14px color-mix(in srgb,var(--accent-2) 50%,transparent)}

// Стабільний «перемішаний» порядок: осі чергуються, але в однаковому порядку в обох учасників.
const ORDER = (() => {
  let seed = 20241017;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const byAxis = {};
  QUESTIONS.forEach(q => { (byAxis[q.axis] = byAxis[q.axis] || []).push(q.id); });
  const keyed = [];
  Object.keys(byAxis).forEach(ax => {
    const arr = byAxis[ax];
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    arr.forEach((qi, pos) => keyed.push([(pos + 0.5) / arr.length + (rnd() - 0.5) * 0.03, qi]));
  });
  keyed.sort((x, y) => x[0] - y[0]);
  return keyed.map(k => k[1]);
})();

  const take = (fid, sign) => QUESTIONS.find(q => q.facet === fid && q.key * sign > 0).id;
  const ids = [];
  for (const ax of ['EI', 'SN', 'TF', 'JP']) {
    const f = n => ax.toLowerCase() + n;
    ids.push(take(f(1), 1), take(f(1), -1), take(f(2), 1), take(f(3), -1), take(f(4), 1), take(f(4), -1));
  }
  ids.push(take('at1', 1), take('at1', -1), take('at2', 1), take('at2', -1), take('at3', 1), take('at3', -1));
  return ids.sort((a, b) => a - b);
})();

function score(ans, quick) {
  const ax = {}, fc = {}, set = quick === undefined ? null : new Set(qIds(quick));   // маска: лише твердження набору кімнати
  AXES.forEach(a => ax[a.id] = { sum: 0, n: 0 });
  FACETS.forEach(f => fc[f.id] = { sum: 0, n: 0 });
  QUESTIONS.forEach((q, i) => {
    if (set && !set.has(i)) return;
    const v = ans[i]; if (v == null || v === SKIP) return;
    ax[q.axis].sum += v * q.key; ax[q.axis].n++;
    fc[q.facet].sum += v * q.key; fc[q.facet].n++;
  });
  const out = { ax: {}, fc: {}, n: {} };
  for (const k in ax) { out.ax[k] = ax[k].n ? ax[k].sum / (3 * ax[k].n) : 0; out.n[k] = ax[k].n; }
  for (const k in fc) { out.fc[k] = fc[k].n ? fc[k].sum / (3 * fc[k].n) : 0; out.n[k] = fc[k].n; }
  return out;
}
function blend(a, b, w) {
  const out = { ax: {}, fc: {}, n: {} };
  for (const k in a.ax) out.ax[k] = a.ax[k] * (1 - w) + b.ax[k] * w;
  for (const k in a.fc) out.fc[k] = a.fc[k] * (1 - w) + b.fc[k] * w;
  for (const k in a.n) out.n[k] = Math.min(a.n[k], b.n[k]);
  return out;
}
function avgScores(list) {
  const out = { ax: {}, fc: {}, n: {} };
  const keys = o => Object.keys(o);
  for (const k of keys(list[0].ax)) out.ax[k] = list.reduce((s, x) => s + x.ax[k], 0) / list.length;
  for (const k of keys(list[0].fc)) out.fc[k] = list.reduce((s, x) => s + x.fc[k], 0) / list.length;
  for (const k of keys(list[0].n)) out.n[k] = Math.min(...list.map(x => x.n[k]));

}
const pctOf = s => Math.max(0, Math.min(100, Math.round(50 + 50 * s)));   // % до ПЕРШОГО полюса
function typeOf(sc) {

  const id = sc.ax.AT > 0 ? 'A' : 'T';

}

}

    .filter(o => o.d < (lim || 0.2)).sort((x, y) => x.d - y.d).slice(0, 2)
    .map(o => { const c = base.slice(); c[o.i] = sc.ax[o.ax.id] > 0 ? o.ax.b.k : o.ax.a.k; return c.join(''); });
}
/** Розбіжність між друзями: середня попарна різниця (п.п.) по чотирьох основних осях; не залежить від кількості друзів. */
function agreement(fs) {
  if (fs.length < 2) return null;
  let t = 0, n = 0;
  for (const ax of AXES.slice(0, 4)) for (let i = 0; i < fs.length; i++) for (let j = i + 1; j < fs.length; j++) { t += Math.abs(pctOf(fs[i].ax[ax.id]) - pctOf(fs[j].ax[ax.id])); n++; }
  return Math.round(t / n);
}
function computeType(w, list) {

  const fr = list.filter(p => p.role === 'friend' && p.done).sort((x, y) => String(x.id) < String(y.id) ? -1 : 1);   // канонічний порядок: однакове середнє в усіх

}
function paintQuiz(anim) {
  const card = $('q-card'); if (!card || !Q) return;
  const role = Q.role, qi = Q.order[Q.pos], q = QUESTIONS[qi], wd = wordingOf(role);
  const pron = wd === 'friend' ? effPron() : 'any';

    : fmt('−3 — «зовсім не про {n}», +3 — «точно про {n}». Дивись на те, як людина поводиться зазвичай. Якщо не знаєш — натисни «Не знаю».', pron)}</p>` : '';
  const scale = SCALE.map(v => `<button class="pt ${v < 0 ? 'neg' : v > 0 ? 'pos' : ''} ${cur === v ? 'sel' : ''}" data-act="ans" data-v="${v}" data-s="${v}" role="radio" aria-checked="${cur === v}" aria-label="${sgn(v)}">${sgn(v)}</button>`).join('');
  card.innerHTML = `<div class="${anim ? 'qanim' + (Q.dir === 'b' ? ' back' : '') : ''}" style="display:flex;flex-direction:column;gap:22px;flex:1;justify-content:space-between">
      <div><div class="qmeta"><span>Питання ${Q.pos + 1} з ${need}${S.quick ? ' · ⚡ швидкий' : ''}</span><span>${Math.round(n / need * 100)}%</span></div>
        <div class="qtext" style="margin-top:14px" tabindex="-1" id="q-text">${esc(nb(text))}</div>${intro}</div>
      <div><div class="scale" role="radiogroup" aria-label="Оцінка від −3 до +3">${scale}</div>
        <div class="scale-cap"><b>Зовсім ні</b><span>Нейтрально</span><b>Цілком так</b></div>
        ${wd === 'friend' ? `<div style="text-align:center;margin-top:10px"><button class="btn small ghost ${cur === SKIP ? 'sel-skip' : ''}" data-act="ans" data-v="${SKIP}">Не знаю</button></div>` : ''}</div>

function answer(v) {
  if (!Q) return;
  const role = Q.role, qi = Q.order[Q.pos], need = Q.order.length;
  S.ans[role][qi] = v;
  const n = cntSet(S.ans[role], S.quick), finished = n === need;

  save(); buzz(8);
  document.querySelectorAll('#q-card .pt').forEach(b => { const on = +b.dataset.v === v; b.classList.toggle('sel', on); b.setAttribute('aria-checked', on); });
  document.querySelectorAll('#q-card .sel-skip').forEach(b => b.classList.remove('sel-skip')); if (v === SKIP) { const sk = document.querySelector('#q-card [data-v="9"]'); if (sk) sk.classList.add('sel-skip'); }

  });

/* ───────── «Чому так?» — розбір тверджень ───────── */
function gapRows(R) {
  const cmp = R.kind === 'compat';
  const mine = cmp ? R.a.ans : R.self.ans, others = cmp ? [R.b.ans] : R.friends.map(f => f.ans);
  const out = [];
  QUESTIONS.forEach(q => {
    const s = mine[q.id]; if (s == null || s === SKIP) return;
    const vs = others.map(o => o[q.id]).filter(v => v != null && v !== SKIP); if (!vs.length) return;
    const f = vs.reduce((a, b) => a + b, 0) / vs.length;
    out.push({ q, s, f, gap: Math.round(Math.abs(s - f) * 2) / 2 });
  });
  return out;
}

  }).join('') : `<p class="muted" style="margin-top:14px">${gaps ? 'Тут великих розбіжностей немає — відповіді близькі.' : 'Тут поки немає тверджень зі збігом.'}</p>`;

let revealIO = null;
function reveal(root, immediate) {
  const els = root.querySelectorAll('.rv:not(.in)');
  if (immediate || !('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('in')); return; }
  if (!revealIO) revealIO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); revealIO.unobserve(e.target); } }), { rootMargin: '0px 0px -6% 0px' });
  els.forEach(e => revealIO.observe(e));
}

    S.turn = 'self'; startQuiz('self');
  },
  delSessAsk(el) {
    openSheet(`<h2>Видалити сесію?</h2><p class="muted">Відповіді й результат буде видалено з цього пристрою. У кімнаті на сервері дані можуть лишатись до 12 годин.</p>
      <div class="row grow mt14"><button class="btn ghost" data-act="closeSheet">Ні</button><button class="btn primary" data-act="delSess" data-id="${esc(el.dataset.id)}">Так, видалити</button></div>`);
  },
  delSess(el) {
    const id = el.dataset.id; closeSheet(); if (!id) return;
    if (id === TAB) { ACT.discard(); go('sessions'); return; }
    lsDel(KEY + '.' + id); render();
  },
});

render();
</script>
</body>
</html>
