2c1a8"}],e=Object.fromEntries(t.map((t=>[t.id,t]))),n=[{id:"ei1",axis:"EI",name:"Джерело енергії",a:"від людей",b:"на самоті",q:[[1,"Після гучної вечірки {s} відчуває приплив сил, а не втому.","Після гучної вечірки я відчуваю приплив сил, а не втому."],[-1,"Після тривалого спілкування {d} потрібно побути на самоті, щоб відновитися.","Після тривалого спілкування мені потрібно побути на самоті, щоб відновитися."],[1,"{S} краще думає, коли проговорює свої думки вголос з іншими.","Я краще думаю, коли проговорюю свої думки вголос з іншими."],[-1,"Ідеальний вечір для {n} — тиша вдома на самоті або з однією-двома близькими людьми.","Ідеальний вечір для мене — тиша вдома на самоті або з однією-двома близькими людьми."],[1,"У великій компанії {s} почувається як риба у воді.","У великій компанії я почуваюсь як риба у воді."]]},{id:"ei2",axis:"EI",name:"Експресивність",a:"виразний",b:"стриманий",q:[[1,"{S} легко починає розмову з незнайомими людьми.","Мені легко почати розмову з незнайомою людиною."],[-1,"{S} говорить мало, якщо тема не здається {d} справді важливою.","Я говорю мало, якщо тема не здається мені справді важливою."],[1,"{S} охоче розповідає про свої справи й почуття навіть малознайомим людям.","Я охоче розповідаю про свої справи й почуття навіть малознайомим людям."],[-1,"Щоб по-справжньому пізнати {g}, потрібен час: {s} відкривається не одразу.","Щоб мене по-справжньому пізнати, потрібен час: я відкриваюсь не одразу."],[-1,"На людях {s} зазвичай стримано виявляє емоції.","На людях я зазвичай стримано виявляю емоції."]]},{id:"ei3",axis:"EI",name:"Коло спілкування",a:"широке",b:"вузьке",q:[[1,"У {n} дуже багато знайомих і приятелів з різних кіл.","У мене дуже багато знайомих і приятелів з різних кіл."],[-1,"{S} має кілька справді близьких людей і не прагне розширювати коло спілкування.","Я маю кількох справді близьких людей і не прагну розширювати коло спілкування."],[1,"Зазвичай саме від {n} виходить ініціатива зібратися, зустрітися чи кудись поїхати.","Зазвичай
